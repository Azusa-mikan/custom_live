<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ live_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="app-bar" id="appBar">
    <h1 class="app-title">{{ live_title }}</h1>
  </header>

  <main>
    <section class="stream-layout" aria-label="直播内容">
      <div class="video-column">
        <div class="video-shell" id="videoShell">
          <video id="liveVideo" playsinline preload="metadata" aria-label="直播视频"></video>
          <div class="video-placeholder" id="videoPlaceholder">
            <svg class="progress" viewBox="0 0 48 48" aria-hidden="true">
              <circle class="progress-track" cx="24" cy="24" r="20" pathLength="100"></circle>
              <circle class="progress-active" cx="24" cy="24" r="20" pathLength="100"></circle>
            </svg>
            <p class="placeholder-title" id="videoStatus"></p>
            <p class="placeholder-copy" id="videoDetail"></p>
            <div class="video-clock" aria-hidden="true">
              <span class="clock-time" id="clockTime"></span>
              <span class="clock-date" id="clockDate"></span>
            </div>
          </div>
          <div class="video-menu" id="videoMenu" role="menu" hidden>
            <button type="button" class="menu-item" id="infoMenuItem" role="menuitem">显示视频信息</button>
          </div>
          <div class="video-info" id="videoInfo" hidden></div>
          <button type="button" class="player-center" id="centerPlay" aria-label="播放或暂停">
            <span class="material-symbols-rounded">play_arrow</span>
          </button>
          <div class="player-controls" id="playerControls">
            <button type="button" class="ctl-btn" id="ctrlPlay" aria-label="播放或暂停">
              <span class="material-symbols-rounded">play_arrow</span>
            </button>
            <button type="button" class="ctl-btn" id="ctrlMute" aria-label="静音">
              <span class="material-symbols-rounded">volume_up</span>
            </button>
            <input class="ctrl-volume" id="ctrlVolume" type="range" min="0" max="100" value="100" aria-label="音量">
            <span class="player-spacer"></span>
            <span class="live-badge" id="liveBadge"><span class="live-dot"></span>LIVE</span>
            <button type="button" class="ctl-btn" id="ctrlFullscreen" aria-label="全屏">
              <span class="material-symbols-rounded">fullscreen</span>
            </button>
          </div>
        </div>
        <div class="under-row">
          <div class="row-left">
            <div class="route-field">
              <button type="button" class="route-select" id="routeSelect" aria-haspopup="listbox" aria-expanded="false">
                <span id="routeLabel">线路 1</span>
                <span class="material-symbols-rounded route-arrow" aria-hidden="true">arrow_drop_down</span>
              </button>
              <ul class="route-menu" id="routeMenu" role="listbox" aria-label="线路" hidden>
                {% for stream in stream_urls %}
                <li class="route-option" role="option" data-index="{{ loop.index0 }}" aria-selected="false">线路 {{ loop.index }}</li>
                {% endfor %}
              </ul>
            </div>
            <button type="button" class="icon-btn" id="settingsButton" aria-label="设置">
              <span class="material-symbols-rounded">settings</span>
            </button>
          </div>
          <div class="like-area">
            <button type="button" class="like-button" id="likeButton" aria-label="给主播点赞">
              <span class="material-symbols-rounded" id="likeIcon">favorite</span>
            </button>
            <span class="like-count" id="likeCount" aria-live="polite">0</span>
          </div>
        </div>
      </div>

      <aside class="chat-column" aria-label="直播消息">
        <div class="chat-shell">
          <div class="message-list" id="messageList" role="log" aria-live="polite" aria-label="消息列表">
            <p class="empty-messages" id="emptyMessages">还没有消息，成为第一个发言的人吧</p>
          </div>
        </div>
        <form class="chat-compose" id="messageForm">
          <input class="message-input" id="messageInput" aria-label="消息内容" maxlength="300" autocomplete="off">
          <button type="submit" class="send-button" aria-label="发送消息">
            <span class="material-symbols-rounded">send</span>
          </button>
        </form>
      </aside>
    </section>
  </main>
  <div class="dialog-overlay" id="nameDialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">聊天设置</h2>
      <p class="dialog-copy">输入你要展示的名称，才能发送消息</p>
      <label class="md3-field">
        <input id="nameInput" type="text" maxlength="20" placeholder=" " autocomplete="nickname">
        <span class="field-label">昵称</span>
      </label>
      <label class="md3-checkbox">
        <input id="shareIpCheckbox" type="checkbox" checked>
        <span class="checkbox-box"><span class="material-symbols-rounded">check</span></span>
        <span>向主播展示我的 IP 地址</span>
      </label>
      <div class="dialog-actions">
        <button type="button" class="md3-btn" id="dialogConfirm">进入</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="liveRoutesData">{{ stream_urls | tojson }}</script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
